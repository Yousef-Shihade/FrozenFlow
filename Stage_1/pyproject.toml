[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvlab"
version = "1.0.0"
description = "Shared library for the CVLAB Summer Project, Stage 1 (classification baselines with frozen encoders)"
readme = "README.md"
requires-python = ">=3.10"

# torch and torchvision are intentionally NOT listed here.
# They must be installed from the PyTorch CUDA index first, because the default PyPI
# wheels are CPU-only and would silently disable the GPU:
#     pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cu124
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel", "nbformat", "nbconvert", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
