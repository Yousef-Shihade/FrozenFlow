[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvlab3"
version = "1.0.0"
description = "Flow-matching layer for Stage 3 (transform frozen features in front of a frozen linear classifier)"
readme = "README.md"
requires-python = ">=3.10"

# torch is intentionally NOT listed here, for the same reason as Stages 1 and 2: it must
# come from the PyTorch CUDA index first, or the CPU-only PyPI wheel silently disables the
# GPU.
#     pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cu124
#
# cvlab (Stage 1) and cvlabfm (Stage 2) are also not listed. They are sibling editable
# installs, not published packages, so they cannot be resolved from an index:
#     pip install -e Stage_1
#     pip install -e Stage_2
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel", "nbformat", "nbconvert", "tqdm"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
